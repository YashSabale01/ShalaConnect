# ===================================
# ShalaConnect - Application Config
# ===================================

# Server
server.port=${PORT:10000}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:shalaconnect_super_secret_jwt_key_must_be_at_least_32_chars_long!!}
app.jwt.expiration=${JWT_EXPIRATION:604800000}

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.static.dir=${STATIC_DIR:static}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Admin seed account
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Logging
logging.level.com.shalaconnect=INFO
logging.level.org.springframework.security=WARN
