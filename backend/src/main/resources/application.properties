# ===================================
# ShalaConnect - Application Config
# ===================================

# Server
server.port=${SERVER_PORT:7070}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:shalaconnect_super_secret_jwt_key_must_be_at_least_32_chars_long!!}
app.jwt.expiration=${JWT_EXPIRATION:604800000}

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Admin seed account (override via env vars ADMIN_EMAIL and ADMIN_PASSWORD)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Logging
logging.level.com.shalaconnect=INFO
logging.level.org.springframework.security=WARN
