[defaults]
# Default inventory file location
inventory = ./inventory/inventory.ini

# Path to search for Ansible Roles
roles_path = ./roles

# Default remote SSH user on managed nodes (e.g., ubuntu on AWS EC2)
remote_user = ubuntu

# Private SSH key path for EC2 authentication (can also be overridden in inventory)
# private_key_file = ~/.ssh/shalaconnect-key.pem

# Disable SSH Host Key Checking for seamless CI/CD automation
host_key_checking = False

# Enable timing and clean YAML output for playbook execution
stdout_callback = yaml
bin_ansible_callbacks = True

# Disable retry files creation (.retry)
retry_files_enabled = False

# Number of parallel processes to spawn when communicating with remote hosts
forks = 5

# Timeout in seconds for SSH connection attempts
timeout = 30

# Path for temporary remote files during execution
remote_tmp = ~/.ansible/tmp
local_tmp  = ~/.ansible/tmp

# Interpreter discovery setting for Python on target Linux servers
interpreter_python = auto_silent

[privilege_escalation]
# Enable privilege escalation (sudo) by default for administrative configuration
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Optimize SSH connection speed via multiplexing (ControlMaster)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
scp_if_ssh = True
