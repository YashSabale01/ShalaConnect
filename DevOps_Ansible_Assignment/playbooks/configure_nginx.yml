---
# ==============================================================================
# Standalone Playbook: Configure Nginx Reverse Proxy for Spring Boot
# ==============================================================================

- name: Setup Nginx Reverse Proxy for ShalaConnect Application
  hosts: devops:webservers:local_test
  become: true
  gather_facts: false

  vars:
    app_port: 8080
    nginx_port: 80
    app_name: "shalaconnect-backend"

  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy Nginx reverse proxy configuration
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
        mode: '0644'
        content: |
          server {
              listen {{ nginx_port }};
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }

              location /api/health {
                  proxy_pass http://127.0.0.1:{{ app_port }}/api/health;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
              }
          }

    - name: Enable site by creating symlink
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ app_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
        state: link

    - name: Remove default Nginx virtual host
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration syntax
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Restart Nginx service
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true
