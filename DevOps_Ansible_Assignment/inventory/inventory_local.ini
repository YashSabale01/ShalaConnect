# ==============================================================================
# Local Testing & Development Inventory (WSL2 / Local Linux / EC2 Localhost)
# ==============================================================================

[local_dev]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[local_test]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[webservers]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[app_servers]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[devops:children]
webservers
app_servers
local_test
local_dev

[all:vars]
environment_tier=local_development
app_port=8080
nginx_port=80
java_version=21
app_install_dir=/opt/shalaconnect-app
app_user=appuser
app_group=appuser
app_name=shalaconnect-backend
app_jar_name=shalaconnect-backend-1.0.0.jar
