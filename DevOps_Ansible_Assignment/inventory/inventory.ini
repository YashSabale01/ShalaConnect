# Group 1: AWS EC2 Cloud Instances (Production & Staging Environments)
[aws_ec2]
# Primary Managed Application Server (AWS EC2 Amazon Linux 2023)
ec2-app-prod-01 ansible_host=13.126.181.31 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/shalaconnect-key.pem server_role=production

# Group 2: Web Server Tier (Where Nginx reverse proxy runs)
[webservers]
ec2-app-prod-01

# Group 3: Application Server Tier (Where Java 21 Spring Boot runtime and systemd run)
[app_servers]
ec2-app-prod-01

# Group 4: Localhost / Testing Environment
[local_test]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3 server_role=development

# Unified Parent Group
[devops:children]
aws_ec2
webservers
app_servers

# ==============================================================================
# Global Variables for all hosts in the devops group
# ==============================================================================
[devops:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
app_port=8080
app_name=shalaconnect-backend
app_jar_name=shalaconnect-backend-1.0.0.jar
app_user=appuser
app_group=appuser
app_install_dir=/opt/shalaconnect-app
java_version=21
nginx_port=80
environment_name=production
