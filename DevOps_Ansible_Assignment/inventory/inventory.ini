# Group 1: AWS EC2 Cloud Instances (Production & Staging Environments)
[aws_ec2]
# Primary Production Server (Active AWS EC2 Amazon Linux 2023 Instance)
ec2-app-prod-01 ansible_host=13.201.133.251 ansible_user=ec2-user ansible_ssh_private_key_file="d:/java/New folder/ShalaConnect/shalaconnect-key.pem" server_role=production

# Staging Application Server
ec2-app-stage-01 ansible_host=3.85.90.112 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/shalaconnect-key.pem server_role=staging

# Group 2: Web Server Tier (Where Nginx reverse proxy runs)
[webservers]
ec2-app-prod-01
ec2-app-stage-01

# Group 3: Application Server Tier (Where Java 21 Spring Boot runtime and systemd run)
[app_servers]
ec2-app-prod-01
ec2-app-stage-01

# Group 4: Localhost / Testing Environment (Used for local verification or WSL2)
[local_test]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3 server_role=development

# Unified Parent Group
[devops:children]
webservers
app_servers

# ==============================================================================
# Global Variables for all hosts in the devops group
# ==============================================================================
[devops:vars]
ansible_python_interpreter=/usr/bin/python3
app_port=8080
app_name=shalaconnect-backend
app_jar_name=shalaconnect-backend-1.0.0.jar
app_user=appuser
app_group=appuser
app_install_dir=/opt/shalaconnect-app
java_version=21
nginx_port=80
environment_name=production
