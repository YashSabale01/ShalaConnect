# ==============================================================================
# Dedicated AWS EC2 Production Inventory - ShalaConnect Spring Boot Backend
# Control Node: 13.201.133.251 (Runs Ansible)
# Target Managed Node: 13.126.181.31 (Where ShalaConnect App & Nginx are Deployed)
# ==============================================================================

[aws_production]
ec2-app-server ansible_host=13.126.181.31 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/shalaconnect-key.pem

[app_servers]
ec2-app-server

[webservers]
ec2-app-server

[aws_production:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
environment_tier=production
app_name=shalaconnect-backend
app_port=8080
nginx_port=80
java_version=21
app_jar_name=shalaconnect-backend-1.0.0.jar
app_user=appuser
app_group=appuser
app_install_dir=/opt/shalaconnect-app
