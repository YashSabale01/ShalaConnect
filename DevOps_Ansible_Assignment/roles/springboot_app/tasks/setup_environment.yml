---
# ==============================================================================
# Tasks: Setup System Environment, Dependencies, OpenJDK 21 & System User
# Supports: Debian/Ubuntu (apt) and Amazon Linux 2023 / RedHat (dnf)
# ==============================================================================

# Debian / Ubuntu Systems
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  tags: [setup, dependencies]

- name: Install OpenJDK 21, Maven, PostgreSQL client and core utilities (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ required_system_packages }}"
    state: present
  when: ansible_os_family == "Debian"
  tags: [setup, java, dependencies]

# Amazon Linux / RedHat Systems
- name: Install Java 21 (Corretto), Maven, Nginx, PostgreSQL and utilities (Amazon Linux / RedHat)
  ansible.builtin.dnf:
    name:
      - java-21-amazon-corretto
      - maven
      - nginx
      - git
      - postgresql15-server
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"
  tags: [setup, java, dependencies]

- name: Check if PostgreSQL database directory is initialized (Amazon Linux)
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: pg_initialized
  when: ansible_os_family == "RedHat"
  tags: [setup, postgresql]

- name: Initialize PostgreSQL database cluster if not initialized (Amazon Linux)
  ansible.builtin.command: postgresql-setup --initdb
  when:
    - ansible_os_family == "RedHat"
    - not pg_initialized.stat.exists
  tags: [setup, postgresql]

- name: Configure pg_hba.conf for local trust authentication
  ansible.builtin.replace:
    path: /var/lib/pgsql/data/pg_hba.conf
    regexp: 'scram-sha-256|ident'
    replace: 'trust'
  when: ansible_os_family == "RedHat"
  notify: restart postgresql
  tags: [setup, postgresql]

- name: Ensure PostgreSQL service is enabled and started
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  tags: [setup, postgresql]

- name: Create PostgreSQL application database if not exists
  ansible.builtin.command: >
    psql -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'school_management'"
  register: db_check
  changed_when: false
  failed_when: false
  become_user: postgres
  tags: [setup, postgresql]

- name: Initialize school_management database
  ansible.builtin.command: createdb -U postgres school_management
  when:
    - db_check.stdout is defined
    - "'1' not in db_check.stdout"
  become_user: postgres
  tags: [setup, postgresql]

- name: Set postgres user password
  ansible.builtin.command: >
    psql -U postgres -d postgres -c "ALTER USER postgres WITH PASSWORD 'postgres';"
  changed_when: false
  failed_when: false
  become_user: postgres
  tags: [setup, postgresql]

- name: Verify installed Java version
  ansible.builtin.command:
    cmd: java -version
  register: java_version_check
  changed_when: false
  tags: [setup, java]

- name: Display verified Java runtime version
  ansible.builtin.debug:
    msg: "Java runtime verified on target: {{ java_version_check.stderr_lines[0] | default('Java installed') }}"
  tags: [setup, java]

- name: Create dedicated application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present
    system: true
  when: create_app_user
  tags: [setup, user]

- name: Create dedicated application system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /bin/bash
    home: "{{ app_install_dir }}"
    create_home: false
    state: present
  when: create_app_user
  tags: [setup, user]
