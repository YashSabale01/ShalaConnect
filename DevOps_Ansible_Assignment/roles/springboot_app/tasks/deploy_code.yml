---
# ==============================================================================
# Tasks: Deploy Spring Boot Executable JAR & Properties
# ==============================================================================

- name: Create application target directory
  ansible.builtin.file:
    path: "{{ app_install_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  tags: [deploy, app]

- name: Create application logging directory
  ansible.builtin.file:
    path: "{{ app_log_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  tags: [deploy, app]

- name: Copy Spring Boot executable JAR to managed node
  ansible.builtin.copy:
    src: "{{ app_source_dir }}/{{ app_jar_name }}"
    dest: "{{ app_install_dir }}/{{ app_jar_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  notify: restart springboot app
  tags: [deploy, app]

- name: Deploy production application.properties from template
  ansible.builtin.template:
    src: app_env.j2
    dest: "{{ app_install_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  notify: restart springboot app
  tags: [deploy, config]
