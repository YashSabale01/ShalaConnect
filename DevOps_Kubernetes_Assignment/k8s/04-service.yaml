apiVersion: v1
kind: Service
metadata:
  name: shalaconnect-service
  namespace: shalaconnect
  labels:
    app: shalaconnect-backend
    app.kubernetes.io/name: shalaconnect-backend
    app.kubernetes.io/component: service
spec:
  type: NodePort
  selector:
    app: shalaconnect-backend
  ports:
    - name: http
      protocol: TCP
      port: 80              # Service port accessible inside cluster
      targetPort: 8080      # Container port where Spring Boot listens
      nodePort: 30080       # External port exposed on all worker nodes
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: shalaconnect-internal-clusterip
  namespace: shalaconnect
  labels:
    app: shalaconnect-backend
    tier: internal
spec:
  type: ClusterIP
  selector:
    app: shalaconnect-backend
  ports:
    - name: http-internal
      protocol: TCP
      port: 8080
      targetPort: 8080
