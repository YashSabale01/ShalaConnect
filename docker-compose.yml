version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shalaconnect_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: shala123
      MYSQL_DATABASE: school_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: shalaconnect_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/school_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: shala123
      JWT_SECRET: shalaconnect_super_secret_jwt_key_must_be_at_least_32_chars!!
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    ports:
      - "7070:7070"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: shalaconnect_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:
